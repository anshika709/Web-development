<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Projects</title>
</head>
<body>
    
    <p>Youtube Subscribe Button</p>
    <button onclick="
        subscribe();
    " class = "js-subscribe-button">Subscribe</button>

    <p>Amazon Shipping Calculator</p>

    <input placeholder="Cost of Project" class="js-cost-input" onkeydown="handleCostKeydown(event);
    ">
    <!-- clicks, keydowns : events; onclick, onkeydown : event listeners also event.key tells which key we pressed -->

    <button onclick="
        calculateTotal();
    ">Calculate</button> 
    <p class="js-total-cost"></p>


    <script>

        String(24); // this converts 24 into string
        console.log('24' - 4); // type conversion
        console.log('24' + 4); // this converts maths to string 

        window.document
        window.console.log('window');
        window.alert // window is a builtin object

        function handleCostKeydown(event){
            if(event.key === 'Enter'){
                calculateTotal();
            }
        }

        function calculateTotal(){
            const inputElement = document.querySelector('.js-cost-input');
            // inputElement.value is used to take input in textbox and input is used to make a textbox
            let cost=Number(inputElement.value);

            if (cost<40){
                cost=cost+10;
            }

            document.querySelector('.js-total-cost').innerHTML = `$${cost}`;
        }

        function subscribe() {
            const buttonElement = document.querySelector('.js-subscribe-button');

        // innerHTML takes all the element inside the button or whatever part we are slecting but in case of innerText it selects only text
        if(buttonElement.innerText === 'Subscribe'){
            buttonElement.innerText='Subscribed';
        }
        else{
            buttonElement.innerText='Subscribe';
        }
        }
    </script>
</body>
</html>
