<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissor_Game</title>
</head>
<body>
    <p>
        Rock Paper Scissors
    </p>
    
    <button onclick="
        //Math.random() generates a random no in between 0 to 1
      playGame('Rock');
    ">Rock</button>


    <button onclick="
        playGame('Paper');
    "
    >Paper</button>


    <button onclick="
        //Math.random() generates a random no in between 0 to 1
        playGame('Scissors');
        "
    >Scissors</button>

    <button onclick="
        score.wins=0;
        score.losses=0;
        score.ties=0;
        localStorage.removeItem('score');
        "
    >Reset Score
    </button>



    <script>
        let score = JSON.parse(localStorage.getItem('score')) || {
            wins: 0,
            losses: 0,
            ties:0
        };
        

        function playGame(player_move){
            const computer_move=pickcomputermove();


            let result= '';
            
                if(player_move==='Scissors'){
                    if(computer_move=== 'Rock'){
                    result= 'you lose';
                }
                else if(computer_move=== 'Paper'){
                    result='you won';
                }
                else{
                    result= 'tie';
                }
                }
            
                if(player_move==='Paper'){
                    if(computer_move=== 'Rock'){
                    result= 'you won';
                }
                else if(computer_move=== 'Paper'){
                    result='tie';
                }
                else{
                    result= 'you lose';
                }
                }

                if(player_move==='Rock'){
                    if(computer_move=== 'Rock'){
                    result= 'tie';
                }
                else if(computer_move=== 'Paper'){
                    result='you lose';
                }
                else{
                    result= 'you won';
                }
                }


            if(result==='you won'){
                score.wins += 1;
            }
            else if(result === 'you lose'){
                score.losses+=1;
            }
            else{
                score.ties+=1;
            }

            // localStorage only works on string 
            localStorage.setItem('score', JSON.stringify(score))

            alert(`you picked ${player_move}. Computer picked ${computer_move}. ${result}
Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
        }

        function pickcomputermove(){
            const random_no=Math.random();
            let computer_move='';
            if(random_no>=0 && random_no<1/3){
                computer_move='Rock';
            }
            else if(random_no>=1/3 && random_no<2/3){
                computer_move='Paper';
            }
            else{
                computer_move='Scissors';
            }

            return computer_move;
        }
    </script>
</body>
</html>
