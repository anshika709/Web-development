    <button class="js_button">Click</button>

        const buttonElement = document.querySelector('.js_button');

        //let's store the function for passing the function in removeEventListener
        const  eventListener = () => {

        }

        //addEventListener has two parameters: 1-event or what type of interection we are listening for(the way to  find the event name is look after the word on like here it is click), 2-a function we want to run when we click the element

        buttonElement.addEventListener('click', /*() => {
            console.log('click');
        } replacing the function with variable*/ eventListener );
        
        
        //advantages of addEventListener:  1-> Multiple event listeners for an event
        
        buttonElement.addEventListener('click', () => {
            console.log('click2');
        });
        
        //Advantage2 -> we can remove an event listener using .removeEventListener()
        //also it has two parameters: 1-> event, 2->the function which we want to remove

        // TWO MORE ARRAY METHODS

        // 1: .filter() it works the same way as forEach and it has 2 parameters value and index
        // it creates a new array and if the inner function return true value then it puts that value into array and if it returns it doesn't

        console.log([1, -3, 5].filter((value, index) => {
            if(value>=0){
                return true;
            }
            else{
                return false;
            }
        }));

        //2: .map(): it works same as the .filter() the difference is just that it puts whatever value which is returned by the inner function

        console.log([1, 1, 3].map((value, index) => {
            return value * 2;
        }));

        // shortcut for arrow function

        //notice that we are not using this arrow function so we can remove it also ther's just one parameter so we can remove the round brackets also ther's just one line of code so we can remove the curly brackets and return
