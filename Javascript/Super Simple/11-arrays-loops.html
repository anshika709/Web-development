        // arrays are refrences same as object also when we make copy of array the 2nd array doesn't actually makes copy of actual value it makes copy of the memory location

        // in this example both the arrays are updated doesn't matter that we added 4 to array2 that's what reference nature of arrays means... to avoid this behaviour we can create a copy of values in the array using a method called slice.

        const array3 = [4, 5, 6];
        const array4 = array3.slice();
        // this will make a copy of array3 and asign it to array4.
